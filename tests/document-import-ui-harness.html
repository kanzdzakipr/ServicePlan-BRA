<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>WAITING</title>
    <link rel="stylesheet" href="../scripts/report-forms.css">
    <link rel="stylesheet" href="../scripts/document-import.css">
</head>
<body>
    <nav class="sidebar-menu"><a id="menu-reports"></a></nav>
    <main>
        <section id="view-reports" class="view-section">
            <div id="reportModule"></div>
        </section>
    </main>
    <pre id="result"></pre>
    <script src="../scripts/vendor/jszip-3.10.1.min.js"></script>
    <script src="../scripts/vendor/pdf-3.11.174.min.js"></script>
    <script src="../scripts/vendor/tesseract-5.1.1.min.js"></script>
    <script src="../scripts/report-forms.js"></script>
    <script src="../scripts/document-import-zip-preflight.js"></script>
    <script src="../scripts/document-import-engine.js"></script>
    <script src="../scripts/document-import.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const draftKey = 'fleetmonitor-report-draft-p2h-excavator';
            const lhoDraftKey = 'fleetmonitor-report-draft-lho';
            const historyKey = 'fleetmonitor-report-history-v1';
            const previousDraft = localStorage.getItem(draftKey);
            const previousLhoDraft = localStorage.getItem(lhoDraftKey);
            const previousHistory = localStorage.getItem(historyKey);
            const checks = [];
            function check(name, condition, actual, expected) {
                checks.push({ name, passed: Boolean(condition), actual, expected });
            }
            try {
                localStorage.removeItem(draftKey);
                const schemas = FleetReportForms.getSchemas();
                check('schema_count', schemas.length === 19, schemas.length, 19);
                check(
                    'empty_seed_not_user_data',
                    FleetReportForms.getDraftState('p2h-excavator').hasData === false,
                    FleetReportForms.getDraftState('p2h-excavator').hasData,
                    false
                );
                const historyBefore = JSON.parse(localStorage.getItem(historyKey) || '[]').length;
                const draft = FleetReportForms.importDraft({
                    schemaId: 'p2h-excavator',
                    fields: {},
                    rows: [],
                    importSource: {
                        importId: 'TEST-IMPORT',
                        fileName: 'fixture.pdf',
                        sha256: '0'.repeat(64),
                        mappingCoverage: 0,
                        unmappedFragments: 1
                    }
                });
                check('seed_rows_preserved', draft.rows.length > 1, draft.rows.length, '>1');
                check('seed_checklist_preserved', Boolean(draft.rows[0]?.item), draft.rows[0]?.item || '', 'non-empty');
                check(
                    'import_detected_as_user_data',
                    FleetReportForms.getDraftState('p2h-excavator').hasData === true,
                    FleetReportForms.getDraftState('p2h-excavator').hasData,
                    true
                );
                const historyAfter = JSON.parse(localStorage.getItem(historyKey) || '[]').length;
                check('import_does_not_finalize', historyAfter === historyBefore, historyAfter, historyBefore);

                localStorage.removeItem(lhoDraftKey);
                const normalizedDraft = FleetReportForms.importDraft({
                    schemaId: 'lho',
                    fields: {
                        periode: '07/2026',
                        jenis_alat: ' Excavator ',
                        tipe_merk: ' PC 200 ',
                        lokasi: ' Yard A ',
                        operator: ' Operator A ',
                        id_alat: ' 00123 ',
                        ignored_field: 'DROP'
                    },
                    rows: [{
                        tanggal: '26/07/2026',
                        jam_awal: '7.05',
                        jam_akhir: '08:35:00',
                        jam_kerja: '99',
                        hm_awal: '10',
                        hm_akhir: '12.5',
                        hm_operasi: '99',
                        site: ' Site A ',
                        bbm: 0,
                        cuaca: 'cerah',
                        keterangan: ' Normal ',
                        status: 'misteri',
                        ignored_column: 'DROP'
                    }],
                    importSource: {
                        importId: 'TEST-TYPED-IMPORT',
                        fileName: 'typed-fixture.xlsx',
                        sha256: '1'.repeat(64),
                        mappingCoverage: 1,
                        unmappedFragments: 0
                    }
                });
                check(
                    'typed_field_normalization',
                    normalizedDraft.fields.periode === '2026-07'
                        && normalizedDraft.fields.jenis_alat === 'Excavator'
                        && normalizedDraft.fields.id_alat === '00123',
                    normalizedDraft.fields,
                    { periode: '2026-07', jenis_alat: 'Excavator', id_alat: '00123' }
                );
                check(
                    'typed_row_normalization',
                    normalizedDraft.rows[0].tanggal === '2026-07-26'
                        && normalizedDraft.rows[0].jam_awal === '07:05'
                        && normalizedDraft.rows[0].jam_akhir === '08:35'
                        && normalizedDraft.rows[0].bbm === '0'
                        && normalizedDraft.rows[0].cuaca === 'Cerah',
                    normalizedDraft.rows[0],
                    'canonical date/time/number/select values'
                );
                check(
                    'invalid_enum_rejected',
                    normalizedDraft.rows[0].status === '',
                    normalizedDraft.rows[0].status,
                    ''
                );
                check(
                    'raw_extra_and_readonly_keys_dropped',
                    !Object.prototype.hasOwnProperty.call(normalizedDraft.fields, 'ignored_field')
                        && !Object.prototype.hasOwnProperty.call(normalizedDraft.rows[0], 'ignored_column')
                        && !Object.prototype.hasOwnProperty.call(normalizedDraft.rows[0], 'jam_kerja')
                        && !Object.prototype.hasOwnProperty.call(normalizedDraft.rows[0], 'hm_operasi'),
                    {
                        field: normalizedDraft.fields.ignored_field,
                        column: normalizedDraft.rows[0].ignored_column,
                        jamKerja: normalizedDraft.rows[0].jam_kerja,
                        hmOperasi: normalizedDraft.rows[0].hm_operasi
                    },
                    'keys absent'
                );
                const typeIssueReasons = normalizedDraft.importSource.typeIssues.map(item => item.reason);
                check(
                    'type_issues_recorded',
                    normalizedDraft.importSource.typeIssueCount >= 5
                        && ['unknown_field_ignored', 'unknown_column_ignored', 'readonly_ignored', 'select_option_mismatch']
                            .every(reason => typeIssueReasons.includes(reason)),
                    {
                        count: normalizedDraft.importSource.typeIssueCount,
                        reasons: typeIssueReasons
                    },
                    'at least 5 issues with expected reasons'
                );
                const calculatedJam = document.querySelector('[data-row="0"][data-key="jam_kerja"]')?.value;
                const calculatedHm = document.querySelector('[data-row="0"][data-key="hm_operasi"]')?.value;
                check(
                    'readonly_calculation_preserved',
                    calculatedJam === '1.5' && calculatedHm === '2.5',
                    { calculatedJam, calculatedHm },
                    { calculatedJam: '1.5', calculatedHm: '2.5' }
                );

                const malformedDraft = JSON.parse(JSON.stringify(normalizedDraft));
                malformedDraft.rows[0].status = 'misteri';
                localStorage.setItem(lhoDraftKey, JSON.stringify(malformedDraft));
                FleetReportForms.openForm('lho');
                const invalidHistoryBefore = JSON.parse(localStorage.getItem(historyKey) || '[]').length;
                document.getElementById('finalizeReport').click();
                const invalidHistoryAfter = JSON.parse(localStorage.getItem(historyKey) || '[]').length;
                check(
                    'wrong_typed_active_draft_not_finalized',
                    invalidHistoryAfter === invalidHistoryBefore && Boolean(localStorage.getItem(lhoDraftKey)),
                    {
                        history: invalidHistoryAfter,
                        draftStillPresent: Boolean(localStorage.getItem(lhoDraftKey))
                    },
                    { history: invalidHistoryBefore, draftStillPresent: true }
                );

                FleetReportForms.selectPanel('import');
                check('import_route', location.hash === '#reports/import', location.hash, '#reports/import');
                check(
                    'importer_initialized',
                    Boolean(document.getElementById('clearAllImports')),
                    Boolean(document.getElementById('clearAllImports')),
                    true
                );
                FleetReportForms.selectPanel('history');
                check('history_route', location.hash === '#reports/history', location.hash, '#reports/history');
            } catch (error) {
                checks.push({ name: 'runtime', passed: false, actual: error.stack || error.message, expected: 'no error' });
            } finally {
                if (previousDraft == null) localStorage.removeItem(draftKey);
                else localStorage.setItem(draftKey, previousDraft);
                if (previousLhoDraft == null) localStorage.removeItem(lhoDraftKey);
                else localStorage.setItem(lhoDraftKey, previousLhoDraft);
                if (previousHistory == null) localStorage.removeItem(historyKey);
                else localStorage.setItem(historyKey, previousHistory);
            }
            const payload = {
                passed: checks.every(item => item.passed),
                checks
            };
            document.getElementById('result').textContent = JSON.stringify(payload, null, 2);
            history.replaceState(null, '', `${location.pathname}#result=${encodeURIComponent(JSON.stringify(payload))}`);
            document.title = payload.passed ? `PASS UI ${checks.length}/${checks.length}` : 'FAIL UI';
        }, { once: true });
    </script>
</body>
</html>
