<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cutting Bit Import Harness</title>
    <style>
        body { margin: 0; padding: 24px; font: 14px/1.5 system-ui, sans-serif; background: #f4f7fb; color: #172033; }
        main { max-width: 1100px; margin: auto; }
        header, section { background: #fff; border: 1px solid #dce3ed; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        h1 { margin: 0 0 6px; }
        button { border: 0; border-radius: 8px; padding: 10px 14px; background: #2457d6; color: #fff; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 9px; border-bottom: 1px solid #e5e9f0; text-align: left; vertical-align: top; }
        .pass { color: #087443; font-weight: 800; }
        .fail { color: #b42318; font-weight: 800; }
        code { white-space: pre-wrap; }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Cutting Bit Import Harness</h1>
            <p>Pengujian browser terhadap dua laporan mekanik nyata dan satu fixture negatif.</p>
            <button id="run" type="button">Jalankan ulang</button>
        </header>
        <section>
            <strong id="summary">Menunggu...</strong>
            <table>
                <thead><tr><th>Status</th><th>Kasus</th><th>Detail</th></tr></thead>
                <tbody id="results"></tbody>
            </table>
        </section>
        <div id="reportModule" hidden></div>
    </main>
    <script src="../scripts/dashboard.js"></script>
    <script>
        (() => {
            'use strict';

            const FIXTURES = [
                {
                    key: 'XCMG',
                    url: '../material/BAN-GREASE-CUTTING_BIT-AKI/Perhitungan_Cutting_Bit_XCMG_BRR-RM-4101_Tabulasi.md',
                    fileName: 'Perhitungan_Cutting_Bit_XCMG_BRR-RM-4101_Tabulasi.md',
                    headings: 14, tables: 12, tableRows: 116, rows: 62,
                    planning: 1900, actual: 117,
                    anomaly: { bulan: 'Juli', tanggal: 19, planning: 0, actual: 20 },
                    fields: {
                        mesin_unit: 'RM XCMG',
                        kode_unit: 'BRR-RM-4101',
                        material: 'Aspal sedang (10-20 cm)',
                        lokasi: 'Pinang - Kubu',
                        periode_pencatatan: 'Juli dan Agustus',
                        kebutuhan_harian: '50',
                        target_harian_m: '150',
                        hari_kerja: '38',
                        target_total_m: '5700',
                        kebutuhan_dasar: '1900',
                        safety_stock_persen: '20',
                        safety_stock_minimum: '380',
                        total_kebutuhan: '2280',
                        sumber_dokumen: 'PERHITUNGAN CUTTING BIT RECYCLING MACHINE XCMG (BRR-RM-4101)(1).pdf'
                    }
                },
                {
                    key: 'CAT',
                    url: '../material/BAN-GREASE-CUTTING_BIT-AKI/Perhitungan_Cutting_Bit_CAT_RM500_BRR-RM-4102_Tabulasi.md',
                    fileName: 'Perhitungan_Cutting_Bit_CAT_RM500_BRR-RM-4102_Tabulasi.md',
                    headings: 11, tables: 8, tableRows: 67, rows: 31,
                    planning: 150, actual: 50,
                    anomaly: { bulan: 'Juli', tanggal: 21, planning: 0, actual: 50 },
                    fields: {
                        mesin_unit: 'CAT RM500',
                        kode_unit: 'BRR-RM-4102',
                        material: 'Aspal sedang (10-20 cm)',
                        lokasi: 'Simpang Tegar',
                        periode_pencatatan: 'Juli',
                        kebutuhan_harian: '50',
                        target_harian_m: '150',
                        hari_kerja: '3',
                        target_total_m: '450',
                        kebutuhan_dasar: '150',
                        safety_stock_persen: '20',
                        safety_stock_minimum: '30',
                        total_kebutuhan: '180',
                        sumber_dokumen: 'PERHITUNGAN CUTTING BIT RECYCLING MACHINE CAT RM500 (BRR-RM-4102)(1).pdf'
                    }
                }
            ];

            const output = document.getElementById('results');
            const summary = document.getElementById('summary');
            const button = document.getElementById('run');
            const runtimeErrors = [];
            window.addEventListener('error', event => runtimeErrors.push(event.message));
            window.addEventListener('unhandledrejection', event => runtimeErrors.push(String(event.reason)));

            function assert(condition, message, detail = '') {
                if (!condition) throw new Error(`${message}${detail ? ` | ${JSON.stringify(detail)}` : ''}`);
            }

            function add(results, name, callback) {
                try {
                    const detail = callback() || 'OK';
                    results.push({ name, passed: true, detail });
                } catch (error) {
                    results.push({ name, passed: false, detail: error.stack || error.message });
                }
            }

            async function load(spec, engine, schemas) {
                const response = await fetch(new URL(spec.url, location.href), { cache: 'no-store' });
                assert(response.ok, `Fixture ${spec.key} gagal dibaca`, response.status);
                const blob = await response.blob();
                const file = new File([blob], spec.fileName, { type: 'text/markdown', lastModified: 0 });
                const extracted = await engine.extractFile(file, { ocrMode: 'off' });
                return { spec, extracted, record: engine.analyzeImport(extracted, schemas) };
            }

            function render(results, startedAt) {
                const pass = results.filter(item => item.passed).length;
                const fail = results.length - pass;
                summary.textContent = `${fail ? 'FAIL' : 'PASS'} — ${pass} lulus, ${fail} gagal — ${Math.round(performance.now() - startedAt)} ms`;
                summary.className = fail ? 'fail' : 'pass';
                document.title = `[${fail ? 'FAIL' : 'PASS'}] Cutting Bit Import Harness`;
                document.documentElement.dataset.harnessStatus = fail ? 'fail' : 'pass';
                output.innerHTML = results.map(item => `
                    <tr>
                        <td class="${item.passed ? 'pass' : 'fail'}">${item.passed ? 'PASS' : 'FAIL'}</td>
                        <td>${String(item.name).replace(/</g, '&lt;')}</td>
                        <td><code>${String(item.detail).replace(/&/g, '&amp;').replace(/</g, '&lt;')}</code></td>
                    </tr>
                `).join('');
                window.__CUTTING_BIT_HARNESS__ = Object.freeze({
                    done: true, passed: pass, failed: fail,
                    results: results.map(item => ({ ...item }))
                });
            }

            async function run() {
                const startedAt = performance.now();
                const results = [];
                runtimeErrors.length = 0;
                button.disabled = true;
                try {
                    const engine = window.FleetDocumentImportEngine;
                    const forms = window.FleetReportForms;
                    assert(engine && forms, 'API dashboard tidak tersedia');
                    const schemas = forms.getSchemas();
                    add(results, 'Ekstensi Markdown didukung', () => {
                        assert(engine.supportedExtensions.includes('.md'), '.md tidak didukung');
                        assert(engine.supportedExtensions.includes('.markdown'), '.markdown tidak didukung');
                        return engine.supportedExtensions.join(', ');
                    });
                    add(results, 'Schema Cutting Bit ke-20 tersedia', () => {
                        assert(schemas.length === 20, 'Jumlah schema bukan 20', schemas.length);
                        assert(schemas.some(item => item.id === 'cutting-bit-usage'), 'Schema Cutting Bit hilang');
                        return '20 schema';
                    });

                    const fixtures = await Promise.all(FIXTURES.map(spec => load(spec, engine, schemas)));
                    for (const { spec, extracted, record } of fixtures) {
                        const extraction = extracted.extraction;
                        const rows = record.mapping.rows;
                        add(results, `${spec.key}: struktur Markdown`, () => {
                            assert(extraction.format === 'markdown', 'Format salah', extraction.format);
                            assert(extraction.stats.headings === spec.headings, 'Heading salah', extraction.stats);
                            assert(extraction.tables.length === spec.tables, 'Tabel salah', extraction.stats);
                            assert(extraction.stats.markdownTableRows === spec.tableRows, 'Baris tabel salah', extraction.stats);
                            assert(extraction.properties.markdown.coverage === 1, 'Coverage bukan 100%');
                            return `${spec.headings} heading / ${spec.tables} tabel / ${spec.tableRows} row`;
                        });
                        add(results, `${spec.key}: klasifikasi`, () => {
                            assert(record.classification.selectedSchemaId === 'cutting-bit-usage', 'Target salah', record.classification);
                            return `${record.classification.confidence} / ${record.classification.score.toFixed(3)}`;
                        });
                        add(results, `${spec.key}: field dan provenance`, () => {
                            for (const [key, expected] of Object.entries(spec.fields)) {
                                assert(record.mapping.fields[key] === expected, `Field ${key} salah`, {
                                    expected, actual: record.mapping.fields[key]
                                });
                                assert(record.mapping.fieldProvenance[key]?.sourceRef?.startsWith('md:'), `Provenance ${key} hilang`);
                            }
                            assert(!Object.hasOwn(record.mapping.fields, 'tahun'), 'Tahun dikarang');
                            return `${Object.keys(spec.fields).length} field cocok`;
                        });
                        add(results, `${spec.key}: baris dan total`, () => {
                            assert(rows.length === spec.rows, 'Jumlah row salah', rows.length);
                            const planning = rows.reduce((sum, row) => sum + Number(row.planning), 0);
                            const actual = rows.reduce((sum, row) => sum + Number(row.actual), 0);
                            assert(planning === spec.planning, 'Total planning salah', planning);
                            assert(actual === spec.actual, 'Total actual salah', actual);
                            assert(new Set(rows.map(row => `${row.bulan}:${row.tanggal}`)).size === spec.rows, 'Tanggal duplikat');
                            return `${rows.length} row / ${planning} / ${actual}`;
                        });
                        add(results, `${spec.key}: anomali tetap pada tanggal sumber`, () => {
                            const row = rows.find(item => (
                                item.bulan === spec.anomaly.bulan
                                && Number(item.tanggal) === spec.anomaly.tanggal
                            ));
                            assert(row, 'Row anomali hilang');
                            assert(Number(row.planning) === spec.anomaly.planning, 'Planning anomali berubah', row);
                            assert(Number(row.actual) === spec.anomaly.actual, 'Actual anomali berubah', row);
                            assert(/tanpa planning/i.test(row.catatan), 'Catatan review hilang', row);
                            const provenance = record.mapping.rowProvenance.find(item => item.rowId === row._import.rowId);
                            assert(provenance.fields.bulan.method === 'section-context', 'Bulan bukan dari heading');
                            assert(provenance.fields.planning.sourceRef.startsWith('md:'), 'Planning tanpa sourceRef');
                            return `${row.tanggal} ${row.bulan}: ${row.planning}/${row.actual}`;
                        });
                        add(results, `${spec.key}: warning review`, () => {
                            const codes = record.quality.warnings.map(item => item.code);
                            assert(codes.includes('cutting_bit_year_missing'), 'Warning tahun hilang', codes);
                            assert(codes.includes('cutting_bit_actual_without_planning'), 'Warning actual tanpa planning hilang', codes);
                            return codes.join(', ');
                        });
                        add(results, `${spec.key}: batasan semantik tersimpan`, () => {
                            assert(extraction.fragments.some(item => /meter aktual/i.test(item.value)), 'Catatan meter aktual hilang');
                            assert(extraction.fragments.some(item => /bukan saldo/i.test(item.value)), 'Catatan bukan saldo hilang');
                            return `${extraction.fragments.length} fragmen`;
                        });
                    }

                    const negative = await load({
                        key: 'CAT-CONTROL',
                        url: '../material/BAN-GREASE-CUTTING_BIT-AKI/Form_Kontrol_Cutting_Bit_CAT_RM500.md',
                        fileName: 'Form_Kontrol_Cutting_Bit_CAT_RM500.md'
                    }, engine, schemas);
                    add(results, 'Form kontrol CAT tidak mendapat target otomatis', () => {
                        assert(negative.record.classification.selectedSchemaId === null, 'Salah klasifikasi', negative.record.classification);
                        assert(negative.record.target === null, 'Target palsu dibuat', negative.record.target);
                        return `skor tertinggi ${negative.record.classification.score.toFixed(3)}`;
                    });

                    const synthetic = new File([
                        '# Underscore\n\n| Kunci | Nilai |\n|---|---|\n| A__B__C | `BRR__RM__4101` |\n\nUNIT__CODE__ID\n'
                    ], 'underscore.md', { type: 'text/markdown' });
                    const syntheticExtracted = await engine.extractFile(synthetic, { ocrMode: 'off' });
                    add(results, 'Underscore dan code span tidak rusak', () => {
                        const text = syntheticExtracted.extraction.fragments.map(item => item.value).join('\n');
                        for (const expected of ['A__B__C', 'BRR__RM__4101', 'UNIT__CODE__ID']) {
                            assert(text.includes(expected), `${expected} berubah`, text);
                        }
                        return 'underscore utuh';
                    });
                    add(results, 'Tidak ada exception browser', () => {
                        assert(runtimeErrors.length === 0, 'Unhandled exception', runtimeErrors);
                        return '0 exception';
                    });
                } catch (error) {
                    results.push({ name: 'Harness fatal', passed: false, detail: error.stack || error.message });
                } finally {
                    button.disabled = false;
                    render(results, startedAt);
                }
            }

            button.addEventListener('click', run);
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', run, { once: true });
            } else {
                run();
            }
        })();
    </script>
</body>
</html>
