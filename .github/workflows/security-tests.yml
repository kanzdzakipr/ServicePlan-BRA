name: Security Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, fileinfo
          coverage: none
      - name: PHP syntax check
        run: find api archive tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Object authorization and upload unit tests
        run: php tests/security_unit.php
      - name: Security coverage guardrails
        run: php tests/security_static.php
