version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: equipment_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: equipment_db
      MYSQL_USER: equipment_user
      MYSQL_PASSWORD: equipment_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
